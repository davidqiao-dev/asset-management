spring:
  application:
    name: asset-management

  datasource:
    url: jdbc:mysql://localhost:3306/asset_management
    username: root
    password: ${MYSQL_PASS}
    driver-class: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000